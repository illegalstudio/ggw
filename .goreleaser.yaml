version: 2

builds:
  - id: darwin
    main: ./cmd/ggw
    binary: ggw
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/illegalstudio/ggw/internal/version.Version={{.Version}}
      - -X github.com/illegalstudio/ggw/internal/version.Commit={{.ShortCommit}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - scripts/codesign.sh {{ .Path }}

  - id: linux
    main: ./cmd/ggw
    binary: ggw
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/illegalstudio/ggw/internal/version.Version={{.Version}}
      - -X github.com/illegalstudio/ggw/internal/version.Commit={{.ShortCommit}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: darwin
    ids:
      - darwin
    formats:
      - zip
    files:
      - README.md
      - LICENSE
  - id: linux
    ids:
      - linux
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
